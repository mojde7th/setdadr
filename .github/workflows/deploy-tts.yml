# When LIARA_API_TOKEN is set in repo secrets, deploys permanent Dilara TTS.
name: Deploy TTS
on:
  workflow_dispatch:
  push:
    paths:
      - "tts-service/**"
      - ".github/workflows/deploy-tts.yml"
jobs:
  liara:
    runs-on: ubuntu-latest
    if: ${{ secrets.LIARA_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g @liara/cli
      - run: liara deploy --app setdadr-tts --port 8787 --path ./tts-service --api-token "$LIARA_API_TOKEN" --detached
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
