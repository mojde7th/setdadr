<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#12100c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ست‌یار"/>
  <title>ست‌یار</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" href="icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="icon-180.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css?v=6"/>
</head>
<body>
  <div id="app">
    <header class="top" id="topBar">
      <div class="brand">ست<span>‌یار</span></div>
      <nav class="tabs" id="navTabs">
        <button type="button" data-view="home" class="on">جلسات</button>
        <button type="button" data-view="moves">حرکت‌ها</button>
        <button type="button" data-view="edit" id="tabEdit" hidden>ست</button>
      </nav>
    </header>

    <main>
      <section id="view-home" class="view on">
        <div class="home-head">
          <button type="button" class="btn-hero" id="btnNewPlan">جلسه تازه</button>
        </div>
        <ul id="planList" class="list"></ul>
        <p id="planEmpty" class="empty">خالی</p>
      </section>

      <section id="view-moves" class="view">
        <form id="moveForm" class="row-form">
          <input id="moveName" type="text" required maxlength="60" placeholder="نام حرکت"/>
          <input id="moveWork" type="number" min="5" max="600" step="5" value="40" inputmode="numeric" aria-label="ثانیه کار"/>
          <button type="submit" class="btn primary sm">افزودن</button>
        </form>
        <ul id="moveLib" class="list"></ul>
        <p id="moveEmpty" class="empty">خالی</p>
      </section>

      <section id="view-edit" class="view">
        <div class="panel">
          <input id="planTitle" type="text" maxlength="60" placeholder="نام جلسه"/>
          <div class="grid2">
            <label>تعداد ست
              <input id="planRounds" type="number" min="1" max="30" value="4" inputmode="numeric"/>
            </label>
            <label>استراحت بین ست
              <input id="planRestSet" type="number" min="0" max="600" step="5" value="40" inputmode="numeric"/>
            </label>
          </div>
          <label class="rest-lbl">استراحت بین حرکت داخل ست
            <input id="planRestMove" type="number" min="0" max="300" step="5" value="10" inputmode="numeric"/>
          </label>
        </div>

        <div class="panel">
          <form id="addToSetForm" class="row-form">
            <input id="pickMoveName" list="moveDatalist" type="text" required maxlength="60" placeholder="حرکت"/>
            <datalist id="moveDatalist"></datalist>
            <input id="pickWork" type="number" min="5" max="600" step="5" value="40" inputmode="numeric"/>
            <button type="submit" class="btn primary sm" id="btnAddToSet">افزودن به این ست</button>
          </form>
          <ol id="circuitList" class="seq"></ol>
        </div>

        <div class="actions">
          <button type="button" class="btn primary block" id="btnSavePlan">ذخیره</button>
          <button type="button" class="btn ghost block" id="btnCancelEdit">برگشت</button>
        </div>
      </section>

      <section id="view-run" class="view">
        <div class="run-stage" id="runStage">
          <div class="frac" id="runFrac">۱<span>/</span>۴</div>
          <div class="frac-lbl" id="runFracLbl">ست</div>
          <div class="phase" id="runPhase">کار</div>
          <div class="move-big" id="runMove">—</div>
          <div class="timer-big" id="runTimer">0:40</div>
          <div class="sub" id="runSub"></div>
          <div class="next-card" id="nextCard" hidden>
            <div class="next-top">
              <span class="next-lbl" id="nextLbl">حرکت بعدی</span>
              <span class="next-chip" id="nextChip"></span>
            </div>
            <div class="next-name" id="nextName">—</div>
            <div class="next-meta" id="nextMeta"></div>
          </div>
        </div>
        <div class="run-bar">
          <button type="button" class="btn big" id="btnPause">توقف</button>
          <button type="button" class="btn big primary" id="btnSkip">بعدی</button>
          <button type="button" class="btn big ghost" id="btnAbort">خروج</button>
        </div>
      </section>

      <section id="view-done" class="view">
        <div class="done-card">
          <div class="frac done-frac" id="doneFrac">۴<span>/</span>۴</div>
          <p class="done-msg" id="doneMsg"></p>
          <button type="button" class="btn primary block" id="btnDoneHome">جلسات</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js?v=6"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
